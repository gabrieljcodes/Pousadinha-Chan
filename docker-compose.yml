services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pousadinha_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN:-}
      - DATABASE_URL=${DATABASE_URL:-postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-pousadinha}?sslmode=disable}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-pousadinha}
      - DB_SSLMODE=disable
      - API_PORT=${API_PORT:-:8080}
      - GACHA_ENABLED=true
      - GACHA_PUBLIC_URL=${GACHA_PUBLIC_URL:-https://gacha.pousada.space}
      - GACHA_MEDIA_DIR=/app/data/gacha
      - GACHA_STORAGE_BACKEND=${GACHA_STORAGE_BACKEND:-filesystem}
      - GACHA_S3_BUCKET=${GACHA_S3_BUCKET:-}
      - GACHA_S3_REGION=${GACHA_S3_REGION:-}
      - GACHA_S3_ENDPOINT=${GACHA_S3_ENDPOINT:-}
      - GACHA_S3_PREFIX=${GACHA_S3_PREFIX:-}
      - GACHA_S3_PATH_STYLE=${GACHA_S3_PATH_STYLE:-false}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - AWS_PROFILE=${AWS_PROFILE:-}
      - AWS_EC2_METADATA_DISABLED=${AWS_EC2_METADATA_DISABLED:-false}
      - VALKEY_URL=${VALKEY_URL-redis://valkey:6379}
      - CATALOG_ADMIN_PASSWORD=${CATALOG_ADMIN_PASSWORD:-}
    volumes:
      - ./data/gacha:/app/data/gacha
      - ./config.json:/app/config.json
    ports:
      - "${HOST_API_PORT:-8085}:8080"
    depends_on:
      valkey:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
    networks:
      - pousadinha_network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pousadinha_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    networks:
      - pousadinha_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - bot

  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - pousadinha_network

  postgres:
    image: postgres:17-alpine
    container_name: pousadinha_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-pousadinha}
    ports:
      - "${HOST_DB_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-pousadinha}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pousadinha_network

volumes:
  postgres_data:
    name: pousadinha_postgres_data

networks:
  pousadinha_network:
    name: pousadinha_network
    driver: bridge
